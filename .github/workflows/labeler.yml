name: Labeler

# pull_request_target is used only for metadata labeling of fork PRs.
# Do not check out or execute untrusted PR code in this privileged context.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5 commit SHA
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ github.token }}
